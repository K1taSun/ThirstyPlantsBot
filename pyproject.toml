[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thirstyhome"
version = "0.1.0"
description = "ThirstyHome Telegram Bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.14.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.pyrefly]
venv = ".venv"
search-paths = ["src"]
